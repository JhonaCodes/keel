# keel-dsl — AUTHORING vocabulary (YAML apiVersion/kind/metadata/spec).
#
# WHY IT IS A SEPARATE CRATE: the DSL evolves with the rule grammar
# (versioned by apiVersion, spec §11.1); the compiled artifact (snapshot) must
# NOT drag this vocabulary along (forbidden edge snapshot ⇏ dsl), because it
# would couple the snapshot hash to grammar changes — unacceptable against
# invariant 9. It is also the structural guarantee of ADR-004: the runtime has
# NO type with which to represent configuration → the model cannot receive it.
#
# It is a LEAF with respect to the engine: it only depends on keel-core.

[package]
name = "keel-dsl"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keel-core = { path = "../keel-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
jsonschema = { workspace = true }
thiserror = { workspace = true }
