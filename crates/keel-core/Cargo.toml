# keel-core — shared stable vocabulary.
#
# WHY IT IS A SEPARATE CRATE: compiler and runtime must share ONE single law
# for the decision ordering (§7.4-D3) and ONE single canonical hashing
# authority (invariant 9: local and CI verify the same snapshot hash). If they
# lived in two places they could silently diverge — exactly the failure mode
# Keel exists to eliminate.
#
# It is a LEAF: it depends on no other Keel crate.

[package]
name = "keel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
