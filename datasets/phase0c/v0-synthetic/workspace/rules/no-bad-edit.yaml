# Outer-ring rule (spec section 5.3): a `file.edited` carrying BADPATTERN is a
# blocking violation, but the edit already landed — the block is FEEDBACK
# (exit 0), never prevention. It records a LIVE BLOCKER that the completion gate
# (section 12.3) uses to veto closing the session. Repeated at the same
# file+line it feeds the oscillation signal (section 6.5).
apiVersion: keel/v1alpha1
kind: Rule
metadata: { id: src.no-bad-edit, version: 1.0.0, author: phase0c, adrRef: adr:ADR-002, reviewAfter: P6M }
spec:
  reversibility: reversible
  on: [file.edited]
  detect:   { using: builtin:text.contains, with: { value: "BADPATTERN" } }
  validate: { using: builtin:text.contains, with: { value: "BADPATTERN" } }
  enforcement:
    invalid: { decision: block, report: { message: "remove BADPATTERN before continuing" } }
    unknown: { decision: review }
    valid:   { decision: allow }
