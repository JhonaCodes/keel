# Undecidable-tail rule (spec section 4.6): detect classifies a `git` command,
# but validate inspects `content` — which a bare command.requested does not
# carry. Absent input is `unknown`, never a guessed verdict. It is reversible,
# so the unknown maps to `review` (not a block): this exercises the `unknown`
# tail the Phase 0c report measures, without polluting the exit-2 cross-check.
apiVersion: keel/v1alpha1
kind: Rule
metadata: { id: vcs.git-force-review, version: 1.0.0, author: phase0c, adrRef: adr:ADR-003, reviewAfter: P6M }
spec:
  reversibility: reversible
  on: [command.requested]
  detect:   { using: builtin:command.classify, with: { families: ["git"] } }
  validate: { using: builtin:text.contains, with: { value: "--force" } }
  enforcement:
    invalid: { decision: review, report: { message: "forced git operation" } }
    unknown: { decision: review }
    valid:   { decision: allow }
