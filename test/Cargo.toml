# keel-tests — the repository's top-level home for integration / black-box
# tests (spec section 15 functional validation). Unit tests that must reach a module's
# PRIVATE items stay beside their code (a Rust requirement — an external crate
# cannot see private items); everything else lives here, under test/tests/.
#
# These tests run under `cargo test --workspace`, which builds the `keel`
# binary first, so the CLI black-box tests can invoke it from target/.
#
# It also ships `keel-measure`, the Phase 0c enforcement-measurement harness
# (spec section 15.1). The harness is MEASUREMENT, NOT ENGINE CODE: it lives
# here — orchestrating the shipped `keel` binary and reading the ledger
# read-only — precisely so the runtime gains no feature for a one-time
# decision experiment. Its logic is in `src/measure.rs`; the binary is a thin
# entry point.
[package]
name = "keel-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "keel-measure"
path = "src/bin/keel-measure.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
rusqlite = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
keel-core = { path = "../crates/keel-core" }
keel-dsl = { path = "../crates/keel-dsl" }
keel-engine = { path = "../crates/keel-engine" }
