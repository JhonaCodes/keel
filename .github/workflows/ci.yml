# Base CI pipeline. Purpose: give every PR a correctness gate so auto-merge
# never lands a broken tree. `test` is the REQUIRED job (build + workspace
# tests, deterministic against the committed Cargo.lock). `lint` (rustfmt +
# clippy) runs as ADVISORY (continue-on-error) for now, because the current
# baseline is not yet fmt/clippy clean and a repo-wide reformat does not belong
# in this PR; a later chore PR can promote lint to blocking once the tree is
# normalized. The compliance CI plane (`keel ci`) is added on top of this later.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
