# Base CI pipeline. Purpose: give every PR a correctness gate so auto-merge
# never lands a broken tree. Both jobs are REQUIRED: `test` (build + workspace
# tests, deterministic against the committed Cargo.lock) and `lint` (rustfmt
# --check + clippy with -D warnings). The tree is fmt/clippy clean, so lint is
# a blocking gate. The compliance CI plane (`keel ci`) runs in governed repos,
# not here (keel is the tool, not a governed workspace).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
