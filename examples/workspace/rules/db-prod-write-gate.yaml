# Production write gate — spec section 11.4, the ADR-022 reference case:
# preconditions evaluate the STATE OF THE WORLD at the moment of the request
# (explicit env + explicit flag + live credential), not the content of the
# command. Fail-closed: without all three, the command is not even validated.
apiVersion: keel/v1alpha1
kind: Rule
metadata:
  id: db.prod-write-gate
  version: 1.0.0
  author: jhonatan
  adrRef: adr:ADR-044
  reviewAfter: P12M
spec:
  reversibility: irreversible
  on: [command.requested]
  detect:
    using: builtin:command.classify
    with: { families: [mysql-toolkit, psql, mysql] }
  preconditions:
    - using: builtin:env.present
      with: { name: NUI_PROD_WRITE }
      onFail: deny
    - using: builtin:flag.present
      with: { flag: --allow-production-write }
      onFail: deny
    - using: tool:awsume.session-active
      onFail: deny
  validate:
    using: tool:sqlglot.classify-statement
  enforcement:
    invalid:
      decision: block
      report: { message: "destructive or unscoped write against production" }
    unknown:
      decision: deny-pending-approval   # irreversible → human, never an LLM (section 4.7)
    valid:
      decision: allow
