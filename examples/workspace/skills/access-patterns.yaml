# Skill (spec section 14.12): loading levels + exemplar pairs. Delivered by the
# Session Manager: compact on first activation, full on oscillation (section 6.5),
# never re-sent while already in the session's context.
apiVersion: keel/v1alpha1
kind: Skill
metadata: { id: reactive-notifier.access-patterns, version: 1.0.0 }
spec:
  compact: skills/access-patterns/compact.md
  full: skills/access-patterns/full.md
  examples:
    - rejected: "final v = ref.read(orderProvider.notifier).data;"
      accepted: "final v = ref.watch(orderProvider.select((s) => s.value));"
