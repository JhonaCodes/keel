# External tool manifests (spec section 4.4: the tool is code — a registered
# program with a manifest). Paths are RELATIVE to the workspace: the Tool
# Runner executes with cwd = workspace root, so the snapshot contains no
# machine paths (invariant 9).
apiVersion: keel/v1alpha1
kind: Tool
metadata: { id: sqlglot.classify-statement, version: 0.1.0 }
spec:
  command: [python3, bin/sqlglot_classify.py]
  timeoutMs: 5000
  output: verdict-json
---
apiVersion: keel/v1alpha1
kind: Tool
metadata: { id: awsume.session-active, version: 0.1.0 }
spec:
  command: [python3, bin/awsume_session_active.py]
  timeoutMs: 5000
  output: verdict-json
---
apiVersion: keel/v1alpha1
kind: Tool
metadata: { id: reactive-notifier.validate-access, version: 0.1.0 }
spec:
  command: [python3, bin/validate_state_access.py]
  timeoutMs: 5000
  output: verdict-json
