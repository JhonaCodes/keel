# Gate SQL (section 11.4) — tres estados, caso por caso.
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: sql-gate.blocks-truncate }
spec:
  target: rule:db.gate-sql-execution
  event:
    kind: command.requested
    command: "mysql -e \"TRUNCATE TABLE orders\""
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: sql-gate.allows-select }
spec:
  target: rule:db.gate-sql-execution
  event:
    kind: command.requested
    command: "psql -c \"SELECT * FROM orders LIMIT 10\""
  expect: { verdict: valid, decision: allow, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: sql-gate.runtime-built-sql-escalates }
spec:
  target: rule:db.gate-sql-execution
  event:
    kind: command.requested
    command: "php/artisan db:wipe --force"
  expect: { verdict: unknown, decision: deny-pending-approval, origin: deterministic }
---
# Estado reactivo (section 11.3) — el detector nunca decide (section 4.5): un match textual
# dentro de un comentario abre la puerta, pero la TOOL da el veredicto real.
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: reactive.blocks-direct-access }
spec:
  target: rule:reactive-notifier.no-direct-data
  event:
    kind: file.edited
    file: lib/features/order/order_screen.dart
    content: "final value = ref.read(orderProvider.notifier).data;\nfinal x = orderState.notifier.data;"
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: reactive.comment-mention-is-valid-detector-never-decides }
spec:
  target: rule:reactive-notifier.no-direct-data
  event:
    kind: file.edited
    file: lib/features/order/order_screen.dart
    content: "// nunca uses .notifier.data directamente\nfinal v = ref.watch(orderProvider.select((s) => s.value));"
  expect: { verdict: valid, decision: allow, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: reactive.generated-code-is-out-of-scope }
spec:
  target: rule:reactive-notifier.no-direct-data
  event:
    kind: file.edited
    file: lib/generated/model.g.dart
    content: "final x = s.notifier.data;"
  expect: { fired: false }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: reactive.clean-code-does-not-fire-detector }
spec:
  target: rule:reactive-notifier.no-direct-data
  event:
    kind: file.edited
    file: lib/features/order/order_screen.dart
    content: "final v = ref.watch(orderProvider.select((s) => s.value));"
  expect: { fired: false }
