# Equivalencia funcional del prod-write-gate (Phase 0a, section 15.1): cada caso
# replica el comportamiento del gate original — env/flag/credencial
# presentes o ausentes, SQL acotado o no. La decision esperada es la
# DECLARADA (el pasivo la fuerza a review sin perderla).
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.denies-without-env }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "psql -h prod -c \"DELETE FROM orders WHERE id=1\""
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.denies-without-flag }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "psql -h prod -c \"DELETE FROM orders WHERE id=1\""
    env: { NUI_PROD_WRITE: "1", AWSUME_EXPIRATION: "2026-12-31" }
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.denies-without-live-credential }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "psql -h prod --allow-production-write -c \"DELETE FROM orders WHERE id=1\""
    env: { NUI_PROD_WRITE: "1" }
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.blocks-unscoped-delete-even-with-all-preconditions }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "psql -h prod --allow-production-write -c \"DELETE FROM orders\""
    env: { NUI_PROD_WRITE: "1", AWSUME_EXPIRATION: "2026-12-31" }
  expect: { verdict: invalid, decision: block, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.allows-scoped-write-with-all-preconditions }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "psql -h prod --allow-production-write -c \"DELETE FROM orders WHERE created_at < '2020-01-01'\""
    env: { NUI_PROD_WRITE: "1", AWSUME_EXPIRATION: "2026-12-31" }
  expect: { verdict: valid, decision: allow, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.unparseable-sql-escalates-to-human }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "mysql --allow-production-write -e \"$DYNAMIC_STATEMENT\""
    env: { NUI_PROD_WRITE: "1", AWSUME_EXPIRATION: "2026-12-31" }
  # section 4.7 / ADR-017: irreversible + unknown → deny-pending-approval (humano,
  # nunca LLM). La decision declarada lo refleja; el pasivo registra.
  expect: { verdict: unknown, decision: deny-pending-approval, origin: deterministic }
---
apiVersion: keel/v1alpha1
kind: RuleTest
metadata: { id: prod-write.ignores-non-db-commands }
spec:
  target: rule:db.prod-write-gate
  event:
    kind: command.requested
    command: "ls -la"
  expect: { fired: false }
