apiVersion: keel/v1alpha1
kind: Rule
metadata: { id: starter.require-red-before-write, author: starter, adrRef: adr:ADR-000, reviewAfter: P6M }
spec:
  on: [command.requested]
  detect: { using: "builtin:command.classify", with: { families: ["rm"] } }
  preconditions:
    - using: "builtin:evidence.recorded"
      with: { event: "test.completed", verdict: invalid }
      onFail: block
  enforcement:
    valid: { decision: allow }
